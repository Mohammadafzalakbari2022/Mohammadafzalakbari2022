# Recommended stack (plan-07): GitHub Actions builds Flutter; Cloudflare Pages hosts static files.
# Free tier on both; Cloudflare CDN = fast global delivery. No .env on GitHub or Cloudflare —
# compile-time config uses stacked config/dart_defines_*.json only.
name: Deploy Web

on:
  push:
    branches: [main, master]
    paths:
      - "lib/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "l10n.yaml"
      - "config/dart_defines_base.json"
      - "config/dart_defines_prod.json"
      - ".github/workflows/deploy_web.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: cloudflare-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n

      - name: Build web (stacked dart-define-from-file)
        run: |
          flutter build web --release \
            --dart-define-from-file=config/dart_defines_base.json \
            --dart-define-from-file=config/dart_defines_prod.json

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: pride-v3-web
          directory: build/web
          branch: ${{ github.ref_name }}

      - name: Deploy summary
        run: |
          echo "Web deploy finished. Open your Cloudflare Pages URL (*.pages.dev) for project pride-v3-web."
          echo "API (from dart_defines_prod.json): https://mohammadafzalakbari2022.onrender.com"
