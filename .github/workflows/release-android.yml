# Build production Android APK and publish to GitHub Releases (customer download link).
name: Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v3.6.0)"
        required: true
        default: "v3.6.0"

permissions:
  contents: write

jobs:
  release-apk:
    name: build-and-upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses

      - name: Install Android SDK platform 36
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - run: flutter pub get
      - run: flutter gen-l10n

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define-from-file=config/dart_defines_base.json \
            --dart-define-from-file=config/dart_defines_prod.json
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

      - name: Rename APK
        run: |
          SRC=build/app/outputs/flutter-apk/app-release.apk
          cp "$SRC" Khayat-android.apk

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Khayat ${{ steps.tag.outputs.name }}
          make_latest: true
          overwrite_files: true
          generate_release_notes: true
          files: Khayat-android.apk
          body_path: docs/RELEASE_NOTES_TEMPLATE.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
