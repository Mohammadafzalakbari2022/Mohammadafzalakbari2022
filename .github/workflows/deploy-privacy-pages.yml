# Hosts docs/privacy-policy.html on GitHub Pages.
#
# ONE-TIME (required or deploy-pages returns 404):
#   Repo → Settings → Pages → Build and deployment → Source → GitHub Actions
#   (Save, then re-run this workflow.)
#
# FALLBACK if Actions deploy keeps failing:
#   Settings → Pages → Source → Deploy from a branch → main → /docs → Save
#   (No workflow needed; privacy URL works in ~2 minutes.)
#
# Live URL: https://mohammadafzalakbari2022.github.io/Mohammadafzalakbari2022/privacy-policy.html

name: Deploy Privacy Policy (GitHub Pages)

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-privacy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
