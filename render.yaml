# Render Blueprint — Afghan Pride API (NestJS in `api/`)
# https://render.com/docs/blueprint-spec
#
# Plan-07 default: Postgres on Supabase (external). Paste `DATABASE_URL` in the
# dashboard after the blueprint creates the web service (sync: false).
#
# To use Render-managed Postgres instead: add a `databases` block and wire
# `DATABASE_URL` with `fromDatabase` (see Render blueprint docs).

services:
  - type: web
    name: pride-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm install && npm run build
    # Needs DATABASE_URL (Supabase direct URI recommended for Nest).
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
