# Render Blueprint — Afghan Pride API (NestJS in `api/`)
# https://render.com/docs/blueprint-spec
#
# Plan-07 default: Postgres on Supabase (external). Paste `DATABASE_URL` in the
# dashboard after the blueprint creates the web service (sync: false).
#
# To use Render-managed Postgres instead: add a `databases` block and wire
# `DATABASE_URL` with `fromDatabase` (see Render blueprint docs).

services:
  - type: web
    name: pride-api
    runtime: node
    plan: free
    rootDir: api
    # Install devDependencies too (@nestjs/cli); Render sets NODE_ENV=production
    # during build, which otherwise skips devDeps and breaks `nest build`.
    buildCommand: npm install --include=dev && npm run build
    # Needs DATABASE_URL (runtime pooler 6543) and DIRECT_DATABASE_URL (migrations 5432).
    # On Render, use Supabase **pooler** URI for runtime
    # (project ref uplksiwbfmktlssnnxcs — port 6543 + ?pgbouncer=true&sslmode=require).
    # Prisma migrate deploy uses DIRECT_DATABASE_URL on port 5432 (same host, no pgbouncer param).
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
