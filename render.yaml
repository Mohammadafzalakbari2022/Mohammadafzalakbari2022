# Render Blueprint — Afghan Pride API (NestJS in `api/`)
# https://render.com/docs/blueprint-spec
#
# Connect this Git repo. If the dashboard asks for a root directory, use `api`.
#
# If you use Neon / Supabase / RDS instead of Render Postgres, delete the `databases`
# block and set `DATABASE_URL` manually on the web service (Dashboard → Environment).

databases:
  - name: pride-postgres
    plan: free
    databaseName: pride_api

services:
  - type: web
    name: pride-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm install && npm run build
    # Runs after each successful build, before the new release goes live (needs DATABASE_URL).
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pride-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
